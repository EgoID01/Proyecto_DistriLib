{% extends "layout_dashboard.html" %}

{% block title %}Ingresar Libro · DistriLib{% endblock %}

{% block page_content %}
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Ingresar Libro</h1>
    <a href="{{ url_for('inventario.listar_libros') }}" class="btn btn-secondary">
      <i class="fa-solid fa-arrow-left me-1"></i> Volver
    </a>
  </div>

  <div class="row">
    <div class="col-md-7">
      <div class="p-4 bg-white rounded shadow-sm border">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Nombre del libro</label>
              <input type="text" class="form-control" name="nombre" required
                placeholder="Ej: El Quijote">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Autor</label>
              <input type="text" class="form-control" name="autor" required
                placeholder="Ej: Miguel de Cervantes">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Editorial</label>
              <input type="text" class="form-control" name="editorial" required
                placeholder="Ej: Planeta">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Año de publicación</label>
              <input type="number" class="form-control" name="anio_publicacion" required
                placeholder="Ej: 2020" min="1000" max="2099">
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">ISBN</label>
              <input type="text" class="form-control" name="isbn" required
                placeholder="Ej: 978-3-16-148410-0">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Precio (USD)</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" name="precio" required
                  placeholder="0.00" step="0.01" min="0.01">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Stock inicial</label>
              <input type="number" class="form-control" name="stock"
                placeholder="0" min="0" value="0">
              <div class="form-text">Si es 0, el libro quedará inactivo hasta que se ingrese stock.</div>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-book-medical me-1"></i> Registrar libro
            </button>
            <a href="{{ url_for('inventario.listar_libros') }}" class="btn btn-outline-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
