{% extends "layout_dashboard.html" %}

{% block title %}Editar Libro · DistriLib{% endblock %}

{% block page_content %}
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Editar Libro</h1>
    <a href="{{ url_for('inventario.listar_libros') }}" class="btn btn-secondary">
      <i class="fa-solid fa-arrow-left me-1"></i> Volver
    </a>
  </div>

  <div class="row">
    <div class="col-md-7">
      <div class="p-4 bg-white rounded shadow-sm border">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Nombre del libro</label>
              <input type="text" class="form-control" name="nombre" required
                value="{{ libro.nombre }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Autor</label>
              <input type="text" class="form-control" name="autor" required
                value="{{ libro.autor }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Editorial</label>
              <input type="text" class="form-control" name="editorial" required
                value="{{ libro.editorial }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Año de publicación</label>
              <input type="number" class="form-control" name="anio_publicacion" required
                value="{{ libro.anio_publicacion }}" min="1000" max="2099">
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">ISBN</label>
              <input type="text" class="form-control" name="isbn" required
                value="{{ libro.isbn }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Precio (USD)</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" name="precio" required
                  value="{{ libro.precio }}" step="0.01" min="0.01">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Stock actual</label>
              <input type="text" class="form-control" value="{{ libro.stock }}" disabled>
              <div class="form-text">
                Para modificar el stock usa
                <a href="{{ url_for('inventario.ajustar_stock', id=libro.id) }}">Ajustar stock</a>.
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk me-1"></i> Guardar cambios
            </button>
            <a href="{{ url_for('inventario.listar_libros') }}" class="btn btn-outline-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
