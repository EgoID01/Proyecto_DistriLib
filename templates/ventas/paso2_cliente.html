{% extends "layout_dashboard.html" %}

{% block title %}Nueva Venta · Paso 2{% endblock %}

{% block page_content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2">Nueva Venta</h1>
  <form method="POST" action="{{ url_for('ventas.cancelar_venta') }}" style="display:inline;">
    <button type="submit" class="btn btn-outline-secondary btn-sm">Cancelar</button>
  </form>
</div>

<!-- Indicador de pasos -->
<div class="d-flex align-items-center gap-2 mb-4 small fw-semibold">
  <span class="badge bg-secondary px-3 py-2">1 · Libros</span>
  <span class="text-muted">—</span>
  <span class="badge bg-primary px-3 py-2">2 · Cliente</span>
  <span class="text-muted">—</span>
  <span class="badge bg-secondary px-3 py-2">3 · Confirmar</span>
</div>

<div class="row">
  <div class="col-md-7">
    <div class="p-4 bg-white rounded shadow-sm border">

      <!-- Búsqueda por cédula -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Cédula / RUC</label>
        <div class="input-group">
          <input type="text" class="form-control" id="campoCedula"
            placeholder="Ej: 1234567890"
            pattern="\d{10,13}" title="Ingresa entre 10 y 13 dígitos"
            value="{{ cliente.get('cedula_ruc', '') }}">
          <button type="button" class="btn btn-outline-secondary" id="btnBuscarCliente"
            title="Buscar cliente">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="alertaBusqueda" class="mt-2 d-none"></div>
      </div>

      <form method="POST" id="formCliente">
        <input type="hidden" name="cedula_ruc" id="cedulaHidden" value="{{ cliente.get('cedula_ruc', '') }}">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombres</label>
            <input type="text" class="form-control" name="nombres" id="fNombres"
              value="{{ cliente.get('nombres', '') }}" required placeholder="Nombres del cliente">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Apellidos</label>
            <input type="text" class="form-control" name="apellidos" id="fApellidos"
              value="{{ cliente.get('apellidos', '') }}" required placeholder="Apellidos del cliente">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Dirección <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="text" class="form-control" name="direccion" id="fDireccion"
              value="{{ cliente.get('direccion', '') }}" placeholder="Dirección">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Teléfono <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="text" class="form-control" name="telefono" id="fTelefono"
              value="{{ cliente.get('telefono', '') }}" placeholder="Número de teléfono">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Correo <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="email" class="form-control" name="correo" id="fCorreo"
              value="{{ cliente.get('correo', '') }}" placeholder="correo@ejemplo.com">
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <a href="{{ url_for('ventas.paso1_libros') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary px-4">
            Siguiente <i class="fa-solid fa-arrow-right ms-1"></i>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const btnBuscar    = document.getElementById('btnBuscarCliente')
  const campoCedula  = document.getElementById('campoCedula')
  const cedulaHidden = document.getElementById('cedulaHidden')
  const alerta       = document.getElementById('alertaBusqueda')

  const campos = {
    nombres:   document.getElementById('fNombres'),
    apellidos: document.getElementById('fApellidos'),
    direccion: document.getElementById('fDireccion'),
    telefono:  document.getElementById('fTelefono'),
    correo:    document.getElementById('fCorreo'),
  }

  function mostrarAlerta(tipo, mensaje) {
    alerta.className = `mt-2 alert alert-${tipo} py-2 small`
    alerta.textContent = mensaje
    alerta.classList.remove('d-none')
  }

  function limpiarFormulario() {
    Object.values(campos).forEach(c => { c.value = ''; c.readOnly = false })
  }

  btnBuscar.addEventListener('click', () => {
    const cedula = campoCedula.value.trim()
    if (!cedula) {
      mostrarAlerta('warning', 'Ingresa una cédula o RUC antes de buscar.')
      return
    }

    cedulaHidden.value = cedula

    fetch('/ventas/buscar-cliente?cedula=' + encodeURIComponent(cedula))
      .then(r => r.json())
      .then(data => {
        if (data.encontrado) {
          campos.nombres.value   = data.nombres
          campos.apellidos.value = data.apellidos
          campos.direccion.value = data.direccion
          campos.telefono.value  = data.telefono
          campos.correo.value    = data.correo
          Object.values(campos).forEach(c => c.readOnly = true)
          mostrarAlerta('success', `Cliente encontrado: ${data.nombres} ${data.apellidos}`)
        } else {
          limpiarFormulario()
          mostrarAlerta('warning', 'No existe un cliente con esa cédula/RUC. Se registrará como nuevo cliente al confirmar la venta.')
        }
      })
      .catch(() => mostrarAlerta('danger', 'Error al buscar el cliente. Intenta de nuevo.'))
  })

  // Sincronizar cédula hidden con el campo visible al enviar
  document.getElementById('formCliente').addEventListener('submit', () => {
    cedulaHidden.value = campoCedula.value.trim()
    Object.values(campos).forEach(c => c.readOnly = false)
  })

  // Limpiar campos si el usuario modifica la cédula
  campoCedula.addEventListener('input', () => {
    limpiarFormulario()
    alerta.classList.add('d-none')
  })
</script>
{% endblock %}
