<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link
        rel="stylesheet"
        href="../static/css/login_estilo.css"
    />
</head>
<body>
<section class="h-100 gradient-form" style="background-color: #eee;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        <div class="card rounded-3 text-black">
          <div class="row g-0">
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">

                <div class="text-center">
                  <img src="../static/img/img_inicio_sesion.avif"
                       style="width: 120px;" alt="logo">
                  <h4 class="mt-1 mb-5 pb-1"
                      style="font-size: 30px;"
                      >Inicio de sesión</h4>
                </div>

                <form>
                  <p>Ingresa tu nombre de usuario</p>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input type="email" id="form2Example11" class="form-control"
                      placeholder="Usuario" />
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <label class="form-label" for="form2Example11">Ingresa tu contraseña</label>
                    <input type="password" id="form2Example22" class="form-control"
                    placeholder="Contraseña" />
                  </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block fa-lg gradient-custom-2 mb-3" type="button"
                    style="margin-right: 40px;">
                      Iniciar sesión</button>
                    <a class="text-muted" href="#!">Olvidé mi contraseña</a>
                  </div>

                </form>

              </div>
            </div>
            <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
              <div class="text-center w-100">
                  <img src="../static/img/logo.png" class="logo_distrilib" alt="Logo">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script src="../static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
